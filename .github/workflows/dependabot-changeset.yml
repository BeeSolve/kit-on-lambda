name: Dependabot Changeset

# Uses pull_request_target so the job runs in the base-repo context with a
# writable token — Dependabot's default pull_request token is read-only.
# This job only writes a static changeset file and never checks out or executes
# the PR's dependency code, so it is not exposed to "pwn request" style attacks.
on:
  pull_request_target:

permissions:
  contents: write

jobs:
  changeset:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          # After this workflow pushes a changeset commit, the PR contains a
          # non-Dependabot commit; skip verification so re-runs don't fail.
          skip-verification: true

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Create changeset for dependency updates
        # GitHub Actions bumps don't affect the published package (only `dist`
        # ships), so skip them. Only bun/npm dependency updates get a changeset.
        if: ${{ steps.metadata.outputs.package-ecosystem == 'bun' || steps.metadata.outputs.package-ecosystem == 'npm' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail

          changeset_file=".changeset/dependabot-pr-${PR_NUMBER}.md"
          if [ -f "$changeset_file" ]; then
            echo "Changeset already exists at $changeset_file — nothing to do."
            exit 0
          fi

          # A dependency bump doesn't change this library's own public API, so a
          # patch bump is appropriate even for semver-major dep updates.
          summary="Bump ${DEPENDENCY_NAMES} (${UPDATE_TYPE})"

          {
            echo "---"
            echo "\"kit-on-lambda\": patch"
            echo "---"
            echo ""
            echo "$summary"
          } > "$changeset_file"

          echo "Created $changeset_file:"
          cat "$changeset_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$changeset_file"
          git commit -m "chore: add changeset for ${DEPENDENCY_NAMES}"
          git push

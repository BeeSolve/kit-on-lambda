name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Changesets action decides what to do based on pending changesets:
      #   - If changesets exist  -> runs version-script and opens/updates the
      #     "Version Packages" PR (which bumps the version and consumes the
      #     changeset files). It does NOT publish.
      #   - If no changesets exist (i.e. the Version Packages PR was just merged
      #     and this push is that merge) -> runs publish-script to publish.
      # This gating is what makes publish happen only from a committed version
      # bump on main, never from an ephemeral runner-local bump.
      - name: Version or publish
        uses: changesets/action@v2
        with:
          version-script: bunx changeset version
          publish-script: bun run release
          # Create git tags and GitHub releases after a successful publish.
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing uses npm Trusted Publishing (OIDC): the id-token: write
          # permission lets npm mint short-lived credentials, so no NPM_TOKEN is
          # needed. Provenance is enabled via package.json publishConfig.provenance.
